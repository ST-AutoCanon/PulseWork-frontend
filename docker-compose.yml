services:
  backend:
    build:
      context: ../PluseWork-backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=development
      - PORT=5001
      - HOST=0.0.0.0
    volumes:
      - ../PluseWork-backend:/app
      - /app/node_modules
    command: sh -c "cd /app && npm ci && npm rebuild bcrypt --build-from-source && npm start"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:5001
      - PORT=3001
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      - backend
    command: sh -c "HOST=0.0.0.0 npm run dev"
