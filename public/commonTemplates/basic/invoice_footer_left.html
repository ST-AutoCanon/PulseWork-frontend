<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Invoice — Footer Left Signature</title>
    <style>
      @page {
        size: A4;
        margin: 0;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }
      .page {
        width: 210mm;
        height: 297mm;
        padding: 18mm;
        box-sizing: border-box;
        position: relative;
      }
      .header {
        display: flex;
        justify-content: space-between;
      }
      .company_small {
        text-align: right;
      }
      .items {
        width: 100%;
        border-collapse: collapse;
        margin-top: 16px;
      }
      .items th,
      .items td {
        border: 1px solid #e6e9ef;
        padding: 8px;
        font-size: 13px;
      }
      .totals {
        display: flex;
        justify-content: flex-end;
        margin-top: 12px;
      }
      .in-footer {
        position: absolute;
        left: 18mm;
        bottom: 18mm;
        font-size: 12px;
        color: #666;
      }
      .signature {
        margin-top: 22px;
        font-size: 12px;
      }
      .placeholder {
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="page" data-template="invoice_footer_left">
      <div class="header">
        <div class="left">
          <strong>Bill To</strong>
          <div data-field="client_name" class="placeholder">Client</div>
        </div>
        <div class="company_small">
          <div data-field="company_name" style="font-weight: 700">
            Company Name
          </div>
          <div data-field="company_contact" class="placeholder">
            Phone · Email
          </div>
        </div>
      </div>

      <table class="items">
        <thead>
          <tr>
            <th>S.No</th>
            <th>Description</th>
            <th>Qty</th>
            <th>Rate</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody data-field="line_items">
          <tr>
            <td>1</td>
            <td>Hosting</td>
            <td>12</td>
            <td>₹ 250</td>
            <td>₹ 3,000</td>
          </tr>
        </tbody>
      </table>

      <div class="totals">
        <div style="width: 320px">
          <table style="width: 100%; border-collapse: collapse">
            <tr>
              <td style="padding: 6px">Subtotal</td>
              <td style="padding: 6px; text-align: right" data-field="subtotal">
                ₹ 3,000
              </td>
            </tr>
            <tr>
              <td style="padding: 6px">Tax</td>
              <td style="padding: 6px; text-align: right" data-field="tax">
                ₹ 540
              </td>
            </tr>
            <tr>
              <td style="padding: 6px; font-weight: bold">Total</td>
              <td
                style="padding: 6px; text-align: right; font-weight: bold"
                data-field="total"
              >
                ₹ 3,540
              </td>
            </tr>
          </table>
        </div>
      </div>

      <div class="in-footer">
        <div data-field="footer_left" class="placeholder">
          Bank details: Account · IFSC — Authorized Signatory
        </div>
        <div class="signature" data-field="signature">
          __________________________<br />Authorized Signatory
        </div>
      </div>
    </div>
  </body>
</html>
