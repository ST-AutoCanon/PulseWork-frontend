<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Invoice — Logo over Name</title>
    <style>
      @page {
        size: A4;
        margin: 0;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }
      .page {
        width: 210mm;
        height: 297mm;
        padding: 20mm;
        box-sizing: border-box;
      }
      .head-wrap {
        text-align: left;
      }
      .logo {
        max-width: 140px;
      }
      .company h1 {
        margin: 8px 0 0;
        font-size: 20px;
        color: #0b5ed7;
      }
      .company .contact {
        font-size: 12px;
        color: #666;
      }
      .meta {
        display: flex;
        justify-content: space-between;
        margin-top: 18px;
      }
      .items {
        width: 100%;
        border-collapse: collapse;
        margin-top: 16px;
      }
      .items th,
      .items td {
        border: 1px solid #e6e9ef;
        padding: 8px;
        font-size: 13px;
      }
      .totals {
        display: flex;
        justify-content: flex-end;
        margin-top: 12px;
      }
      .in-footer {
        position: absolute;
        left: 20mm;
        right: 20mm;
        bottom: 18mm;
        text-align: center;
        font-size: 11px;
        color: #666;
      }
      .placeholder {
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="page" data-template="invoice_logo_over_name">
      <div class="head-wrap">
        <div class="logo" data-field="logo">
          <img src="" alt="logo" style="max-width: 100%" />
        </div>
        <div class="company">
          <h1 data-field="company_name">Company Name</h1>
          <div data-field="company_contact" class="contact placeholder">
            Phone · Email · Website
          </div>
        </div>
      </div>

      <div class="meta">
        <div>
          <strong>Bill To</strong>
          <div data-field="client_name" class="placeholder">Client</div>
        </div>
        <div style="text-align: right">
          <div>
            <strong>Invoice</strong>
            <span data-field="invoice_no">INV-0005</span>
          </div>
        </div>
      </div>

      <table class="items">
        <thead>
          <tr>
            <th>S.No</th>
            <th>Description</th>
            <th>Qty</th>
            <th>Rate</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody data-field="line_items">
          <tr>
            <td>1</td>
            <td>Development</td>
            <td>10</td>
            <td>₹ 1,000</td>
            <td>₹ 10,000</td>
          </tr>
        </tbody>
      </table>

      <div class="totals">
        <div style="width: 320px">
          <table style="width: 100%; border-collapse: collapse">
            <tr>
              <td style="padding: 6px">Subtotal</td>
              <td style="padding: 6px; text-align: right" data-field="subtotal">
                ₹ 10,000
              </td>
            </tr>
            <tr>
              <td style="padding: 6px">Tax</td>
              <td style="padding: 6px; text-align: right" data-field="tax">
                ₹ 1,800
              </td>
            </tr>
            <tr>
              <td style="padding: 6px; font-weight: bold">Total</td>
              <td
                style="padding: 6px; text-align: right; font-weight: bold"
                data-field="total"
              >
                ₹ 11,800
              </td>
            </tr>
          </table>
        </div>
      </div>

      <div class="in-footer">
        <div data-field="notes" class="placeholder">
          Payment due within 15 days. Thank you.
        </div>
      </div>
    </div>
  </body>
</html>
