<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Invoice — Left Sidebar Logo</title>
    <style>
      @page {
        size: A4;
        margin: 0;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }
      .page {
        width: 210mm;
        height: 297mm;
        padding: 12mm;
        box-sizing: border-box;
        display: flex;
      }
      .sidebar {
        width: 55mm;
        padding: 10px;
        border-right: 1px solid #eee;
      }
      .sidebar .logo {
        max-width: 100%;
      }
      .sidebar .company {
        margin-top: 8px;
      }
      .content {
        flex: 1;
        padding-left: 14mm;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        color: #0b5ed7;
      }
      .items {
        width: 100%;
        border-collapse: collapse;
        margin-top: 16px;
      }
      .items th,
      .items td {
        border: 1px solid #e6e9ef;
        padding: 8px;
        font-size: 13px;
      }
      .totals {
        display: flex;
        justify-content: flex-end;
        margin-top: 12px;
      }
      .in-footer {
        position: absolute;
        left: 12mm;
        right: 12mm;
        bottom: 12mm;
        text-align: center;
        color: #666;
        font-size: 12px;
      }
      .placeholder {
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="page" data-template="invoice_sidebar_left">
      <aside class="sidebar">
        <div class="logo" data-field="logo">
          <img src="" alt="logo" style="max-width: 100%" />
        </div>
        <div class="company">
          <div data-field="company_name" style="font-weight: 700">
            Company Name
          </div>
          <div data-field="company_tag" class="placeholder">
            Tagline / small line
          </div>
        </div>
      </aside>

      <main class="content">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
          "
        >
          <div>
            <strong>Bill To</strong>
            <div data-field="client_name" class="placeholder">Client Name</div>
          </div>
          <div style="text-align: right">
            <div>
              <strong>Invoice #</strong>
              <span data-field="invoice_no">INV-0004</span>
            </div>
            <div>
              <strong>Date</strong>
              <span data-field="invoice_date">2025-04-01</span>
            </div>
          </div>
        </div>

        <table class="items">
          <thead>
            <tr>
              <th>S.No</th>
              <th>Description</th>
              <th>Qty</th>
              <th>Rate</th>
              <th>Amount</th>
            </tr>
          </thead>
          <tbody data-field="line_items">
            <tr>
              <td>1</td>
              <td>Consulting</td>
              <td>1</td>
              <td>₹ 10,000</td>
              <td>₹ 10,000</td>
            </tr>
          </tbody>
        </table>

        <div class="totals">
          <div style="width: 320px">
            <table style="width: 100%; border-collapse: collapse">
              <tr>
                <td style="padding: 6px">Subtotal</td>
                <td
                  style="padding: 6px; text-align: right"
                  data-field="subtotal"
                >
                  ₹ 10,000
                </td>
              </tr>
              <tr>
                <td style="padding: 6px">Tax</td>
                <td style="padding: 6px; text-align: right" data-field="tax">
                  ₹ 1,800
                </td>
              </tr>
              <tr>
                <td style="padding: 6px; font-weight: bold">Total</td>
                <td
                  style="padding: 6px; text-align: right; font-weight: bold"
                  data-field="total"
                >
                  ₹ 11,800
                </td>
              </tr>
            </table>
          </div>
        </div>
      </main>

      <div class="in-footer">
        <div data-field="footer_text" class="placeholder">
          Bank: XXXXXX · A/C: 123456 · IFSC: ABCD000
        </div>
      </div>
    </div>
  </body>
</html>
