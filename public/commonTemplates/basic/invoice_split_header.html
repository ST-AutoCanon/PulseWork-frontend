<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Invoice — Split Header</title>
    <style>
      @page {
        size: A4;
        margin: 0;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }
      .page {
        width: 210mm;
        height: 297mm;
        padding: 18mm;
        box-sizing: border-box;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo {
        max-width: 120px;
      }
      .company h1 {
        margin: 0;
        font-size: 18px;
        color: #0b5ed7;
      }
      .right {
        text-align: right;
      }
      .meta {
        margin-top: 14px;
      }
      .items {
        width: 100%;
        border-collapse: collapse;
        margin-top: 16px;
      }
      .items th,
      .items td {
        border: 1px solid #e6e9ef;
        padding: 8px;
        font-size: 13px;
      }
      .totals {
        display: flex;
        justify-content: flex-end;
        margin-top: 12px;
      }
      .in-footer {
        position: absolute;
        left: 18mm;
        bottom: 18mm;
        color: #666;
        font-size: 12px;
      }
      .placeholder {
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="page" data-template="invoice_split_header">
      <div class="header">
        <div class="left">
          <div class="logo" data-field="logo">
            <img src="" alt="logo" style="max-width: 100%" />
          </div>
          <div class="company">
            <h1 data-field="company_name">Company Name</h1>
          </div>
        </div>
        <div class="right">
          <div>
            <strong>Invoice #</strong>
            <span data-field="invoice_no">INV-0006</span>
          </div>
          <div>
            <strong>Date</strong>
            <span data-field="invoice_date">2025-06-01</span>
          </div>
          <div>
            <strong>Due</strong> <span data-field="due_date">2025-06-15</span>
          </div>
        </div>
      </div>

      <div
        class="meta"
        style="display: flex; justify-content: space-between; margin-top: 16px"
      >
        <div>
          <strong>Bill To</strong>
          <div data-field="client_name" class="placeholder">Client</div>
        </div>
        <div>
          <strong>Ship To</strong>
          <div data-field="ship_to" class="placeholder">Shipping Address</div>
        </div>
      </div>

      <table class="items">
        <thead>
          <tr>
            <th>S.No</th>
            <th>Service</th>
            <th>Qty</th>
            <th>Rate</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody data-field="line_items">
          <tr>
            <td>1</td>
            <td>Package</td>
            <td>1</td>
            <td>₹ 5,000</td>
            <td>₹ 5,000</td>
          </tr>
        </tbody>
      </table>

      <div class="totals">
        <div style="width: 320px">
          <table style="width: 100%; border-collapse: collapse">
            <tr>
              <td style="padding: 6px">Subtotal</td>
              <td style="padding: 6px; text-align: right" data-field="subtotal">
                ₹ 5,000
              </td>
            </tr>
            <tr>
              <td style="padding: 6px">Tax</td>
              <td style="padding: 6px; text-align: right" data-field="tax">
                ₹ 900
              </td>
            </tr>
            <tr>
              <td style="padding: 6px; font-weight: bold">Total</td>
              <td
                style="padding: 6px; text-align: right; font-weight: bold"
                data-field="total"
              >
                ₹ 5,900
              </td>
            </tr>
          </table>
        </div>
      </div>

      <div class="in-footer">
        <div data-field="footer_left" class="placeholder">
          Registered office · GSTIN · Bank details
        </div>
      </div>
    </div>
  </body>
</html>
