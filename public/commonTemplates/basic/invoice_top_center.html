<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Invoice — Top Centered Logo</title>
    <style>
      @page {
        size: A4;
        margin: 0;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }
      .page {
        width: 210mm;
        height: 297mm;
        padding: 20mm;
        box-sizing: border-box;
      }
      .header {
        text-align: center;
      }
      .logo {
        margin: 0 auto;
        max-width: 180px;
      }
      .company h1 {
        margin: 6px 0 0;
        font-size: 20px;
        color: #0b5ed7;
      }
      .meta {
        display: flex;
        justify-content: space-between;
        margin-top: 14px;
      }
      .items {
        width: 100%;
        border-collapse: collapse;
        margin-top: 16px;
      }
      .items th,
      .items td {
        border: 1px solid #e6e9ef;
        padding: 8px;
        font-size: 13px;
      }
      .items th {
        background: #f3f6fb;
        text-align: left;
      }
      .totals {
        display: flex;
        justify-content: flex-end;
        margin-top: 12px;
      }
      .in-footer {
        position: absolute;
        left: 20mm;
        bottom: 20mm;
        font-size: 12px;
        color: #666;
        text-align: left;
      }
      .placeholder {
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="page" data-template="invoice_top_center">
      <div class="header">
        <div class="logo" data-field="logo">
          <img src="" alt="Logo" style="max-width: 100%" />
        </div>
        <div class="company">
          <h1 data-field="company_name">Company Name</h1>
          <div data-field="company_tagline" class="placeholder">
            Tagline or small description
          </div>
        </div>
      </div>

      <div class="meta">
        <div class="bill-to">
          <strong>Bill To</strong>
          <div data-field="client_name" class="placeholder">Client Name</div>
        </div>
        <div class="meta-right">
          <div>
            <strong>Invoice #</strong>
            <span data-field="invoice_no">INV-0002</span>
          </div>
          <div>
            <strong>Date</strong>
            <span data-field="invoice_date">2025-02-01</span>
          </div>
        </div>
      </div>

      <table class="items">
        <thead>
          <tr>
            <th>S.No</th>
            <th>Item/Description</th>
            <th>Qty</th>
            <th>Rate</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody data-field="line_items">
          <tr>
            <td>1</td>
            <td>Service</td>
            <td>2</td>
            <td>₹ 500</td>
            <td>₹ 1,000</td>
          </tr>
        </tbody>
      </table>

      <div class="totals">
        <div style="width: 320px">
          <table style="width: 100%; border-collapse: collapse">
            <tr>
              <td style="padding: 6px">Subtotal</td>
              <td style="padding: 6px; text-align: right" data-field="subtotal">
                ₹ 1,000
              </td>
            </tr>
            <tr>
              <td style="padding: 6px">Tax</td>
              <td style="padding: 6px; text-align: right" data-field="tax">
                ₹ 180
              </td>
            </tr>
            <tr>
              <td style="padding: 6px; font-weight: bold">Total</td>
              <td
                style="padding: 6px; text-align: right; font-weight: bold"
                data-field="total"
              >
                ₹ 1,180
              </td>
            </tr>
          </table>
        </div>
      </div>

      <div class="in-footer">
        <div data-field="company_footer" class="placeholder">
          Company registration · PAN · Bank details
        </div>
      </div>
    </div>
  </body>
</html>
