<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Invoice — Top Right Logo</title>
    <style>
      @page {
        size: A4;
        margin: 0;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }
      .page {
        width: 210mm;
        height: 297mm;
        padding: 18mm;
        box-sizing: border-box;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .company-left {
        max-width: 60%;
      }
      .logo-right {
        max-width: 150px;
        text-align: right;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        color: #0b5ed7;
      }
      .meta {
        margin-top: 12px;
        display: flex;
        justify-content: space-between;
      }
      .items {
        width: 100%;
        border-collapse: collapse;
        margin-top: 16px;
      }
      .items th,
      .items td {
        border: 1px solid #e6e9ef;
        padding: 8px;
        font-size: 13px;
      }
      .totals {
        display: flex;
        justify-content: flex-end;
        margin-top: 12px;
      }
      .in-footer {
        position: absolute;
        right: 18mm;
        bottom: 18mm;
        font-size: 12px;
        color: #666;
        text-align: right;
      }
      .placeholder {
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div
      class="page"
      data-template="invoice_top_right"
      style="
        width: 794px;
        height: 1123px;
        box-sizing: border-box;
        position: relative;
      "
    >
      <div class="header">
        <div class="company-left">
          <h1 data-field="company_name">Company Name Pvt Ltd</h1>
          <div data-field="company_address" class="placeholder">
            Address line 1 · City
          </div>
        </div>
        <div class="logo-right" data-field="logo">
          <img src="" alt="logo" style="max-width: 100%; height: auto" />
        </div>
      </div>

      <div class="meta">
        <div>
          <strong>Bill To</strong>
          <div data-field="client_name" class="placeholder">Client</div>
        </div>
        <div>
          <div>
            <strong>Invoice #</strong>
            <span data-field="invoice_no">INV-0003</span>
          </div>
          <div>
            <strong>Date</strong>
            <span data-field="invoice_date">2025-03-01</span>
          </div>
        </div>
      </div>

      <table class="items">
        <thead>
          <tr>
            <th>S.No</th>
            <th>Description</th>
            <th>Qty</th>
            <th>Rate</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody data-field="line_items">
          <tr>
            <td>1</td>
            <td>Goods</td>
            <td>5</td>
            <td>₹ 200</td>
            <td>₹ 1,000</td>
          </tr>
        </tbody>
      </table>

      <div class="totals">
        <div style="width: 320px">
          <table style="width: 100%; border-collapse: collapse">
            <tr>
              <td style="padding: 6px">Subtotal</td>
              <td style="padding: 6px; text-align: right" data-field="subtotal">
                ₹ 1,000
              </td>
            </tr>
            <tr>
              <td style="padding: 6px">Tax</td>
              <td style="padding: 6px; text-align: right" data-field="tax">
                ₹ 180
              </td>
            </tr>
            <tr>
              <td style="padding: 6px; font-weight: bold">Total</td>
              <td
                style="padding: 6px; text-align: right; font-weight: bold"
                data-field="total"
              >
                ₹ 1,180
              </td>
            </tr>
          </table>
        </div>
      </div>

      <div class="in-footer">
        <div data-field="footer_right" class="placeholder">
          Footer information on right side
        </div>
      </div>
    </div>
  </body>
</html>
