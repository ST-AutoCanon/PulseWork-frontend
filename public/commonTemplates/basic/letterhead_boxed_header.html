<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Letterhead — Boxed Header</title>
    <style>
      @page {
        size: A4;
        margin: 0;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #111;
      }
      .page {
        width: 210mm;
        height: 297mm;
        padding: 18mm;
        box-sizing: border-box;
      }
      .header-box {
        border: 1px solid #e6e9ef;
        padding: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12mm;
        background: #fafbff;
      }
      .logo {
        max-width: 140px;
      }
      .company h1 {
        margin: 0;
        font-size: 16px;
        color: #0b5ed7;
      }
      .contact {
        font-size: 12px;
        color: #666;
        text-align: right;
      }
      .body {
        min-height: 200mm;
        font-size: 13px;
      }
      .in-footer {
        position: absolute;
        left: 18mm;
        right: 18mm;
        bottom: 18mm;
        text-align: center;
        color: #666;
        font-size: 11px;
      }
      .placeholder {
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="page" data-template="letterhead_boxed_header">
      <div class="header-box">
        <div class="logo" data-field="logo">
          <img src="" alt="logo" style="max-width: 100%" />
        </div>
        <div>
          <div class="company">
            <h1 data-field="company_name">Company Name</h1>
          </div>
          <div class="contact" data-field="company_contact">
            Phone · Email · Website
          </div>
        </div>
      </div>

      <div class="body" data-field="body">
        <p class="placeholder">
          Date: <span data-field="date">2025-05-01</span>
        </p>
        <p data-field="content" class="placeholder">
          Your business correspondence goes here...
        </p>
      </div>

      <div class="in-footer" data-field="footer">
        Registered Office · GSTIN · Bank
      </div>
    </div>
  </body>
</html>
