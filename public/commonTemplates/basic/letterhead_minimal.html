<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Letterhead — Minimal</title>
    <style>
      @page {
        size: A4;
        margin: 0;
      }
      body {
        margin: 0;
        font-family: Verdana, Arial, sans-serif;
        color: #111;
      }
      .page {
        width: 210mm;
        height: 297mm;
        padding: 22mm;
        box-sizing: border-box;
        position: relative;
      }
      .company {
        font-size: 13px;
        margin-bottom: 8mm;
      }
      .header {
        display: flex;
        justify-content: flex-start;
        align-items: center;
      }
      .logo {
        max-width: 100px;
        margin-right: 10px;
      }
      .body {
        min-height: 230mm;
        font-size: 13px;
        line-height: 1.45;
      }
      .in-footer {
        position: absolute;
        left: 22mm;
        right: 22mm;
        bottom: 18mm;
        font-size: 10px;
        color: #666;
        border-top: 1px solid #eee;
        padding-top: 6px;
      }
      .placeholder {
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="page" data-template="letterhead_minimal">
      <div class="header">
        <div class="logo" data-field="logo">
          <img src="" alt="logo" style="max-width: 100%" />
        </div>
        <div class="company">
          <span data-field="company_name">Company Name</span> —
          <span data-field="company_tag" class="placeholder">Tagline</span>
        </div>
      </div>

      <div class="body" data-field="body">
        <p data-field="date" class="placeholder">[Date]</p>
        <p data-field="greeting" class="placeholder">Hello,</p>
        <p data-field="content" class="placeholder">Main letter content...</p>
      </div>

      <div class="in-footer" data-field="footer">
        Address · Contact · Website
      </div>
    </div>
  </body>
</html>
