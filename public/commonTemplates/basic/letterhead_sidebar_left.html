<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Letterhead — Left Sidebar</title>
    <style>
      @page {
        size: A4;
        margin: 0;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #111;
      }
      .page {
        width: 210mm;
        height: 297mm;
        padding: 12mm;
        box-sizing: border-box;
        display: flex;
      }
      .sidebar {
        width: 60mm;
        padding: 8px;
        border-right: 1px solid #eee;
      }
      .sidebar .logo {
        max-width: 100%;
      }
      .sidebar .company {
        margin-top: 8px;
        font-size: 12px;
        color: #333;
      }
      .content {
        flex: 1;
        padding-left: 14mm;
      }
      .body {
        min-height: 240mm;
        font-size: 13px;
        line-height: 1.45;
      }
      .in-footer {
        position: absolute;
        left: 12mm;
        right: 12mm;
        bottom: 12mm;
        text-align: center;
        font-size: 11px;
        color: #666;
      }
      .placeholder {
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="page" data-template="letterhead_sidebar_left">
      <aside class="sidebar">
        <div class="logo" data-field="logo">
          <img src="" alt="logo" style="max-width: 100%" />
        </div>
        <div class="company" data-field="company_info">
          <strong data-field="company_name">Company Name</strong><br />
          <span class="placeholder" data-field="company_address"
            >Address · Phone</span
          >
        </div>
      </aside>

      <main class="content">
        <div class="body" data-field="body">
          <p class="placeholder">
            Date <span data-field="date">2025-03-01</span>
          </p>
          <p data-field="letter_text" class="placeholder">Dear Sir/Madam,</p>
        </div>
      </main>

      <div class="in-footer" data-field="footer">
        Bank details · GSTIN · Website
      </div>
    </div>
  </body>
</html>
