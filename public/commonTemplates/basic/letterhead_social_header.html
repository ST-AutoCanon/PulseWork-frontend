<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Letterhead — Social Header</title>
    <style>
      @page {
        size: A4;
        margin: 0;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #111;
      }
      .page {
        width: 210mm;
        height: 297mm;
        padding: 18mm;
        box-sizing: border-box;
        position: relative;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12mm;
      }
      .logo {
        max-width: 120px;
      }
      .company {
        flex: 1;
        text-align: center;
      }
      .social {
        width: 160px;
        text-align: right;
        font-size: 12px;
        color: #666;
      }
      .body {
        min-height: 220mm;
        font-size: 13px;
        line-height: 1.45;
      }
      .in-footer {
        position: absolute;
        left: 18mm;
        right: 18mm;
        bottom: 18mm;
        text-align: center;
        font-size: 11px;
        color: #666;
      }
      .placeholder {
        color: #6b7280;
      }
      .social span {
        display: inline-block;
        margin-left: 8px;
      }
    </style>
  </head>
  <body>
    <div class="page" data-template="letterhead_social_header">
      <div class="header">
        <div class="logo" data-field="logo">
          <img src="" alt="logo" style="max-width: 100%" />
        </div>
        <div class="company">
          <div data-field="company_name" style="font-weight: 700">
            Company Name
          </div>
        </div>
        <div class="social">
          <span data-field="phone" class="placeholder">Phone</span>
          <span data-field="email" class="placeholder">Email</span>
        </div>
      </div>

      <div class="body" data-field="body">
        <p class="placeholder">
          Date: <span data-field="date">2025-06-01</span>
        </p>
        <p data-field="letter_text" class="placeholder">
          Letter body content...
        </p>
      </div>

      <div class="in-footer" data-field="footer">Address · Bank · GST</div>
    </div>
  </body>
</html>
