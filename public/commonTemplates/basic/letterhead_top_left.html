<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Letterhead — Top Left Logo</title>
    <style>
      @page {
        size: A4;
        margin: 0;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #111;
      }
      .page {
        width: 210mm;
        height: 297mm;
        padding: 18mm;
        box-sizing: border-box;
        background: #fff;
        position: relative;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 12mm;
      }
      .logo {
        max-width: 140px;
      }
      .company {
        text-align: right;
      }
      .company h1 {
        margin: 0;
        font-size: 16px;
        color: #0b5ed7;
      }
      .body {
        min-height: 200mm;
        font-size: 13px;
        line-height: 1.45;
      }
      .in-footer {
        position: absolute;
        left: 18mm;
        right: 18mm;
        bottom: 18mm;
        font-size: 11px;
        color: #666;
      }
      .placeholder {
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="page" data-template="letterhead_top_left">
      <div class="header">
        <div class="logo" data-field="logo">
          <img src="" alt="Logo" style="max-width: 100%" />
        </div>
        <div class="company">
          <h1 data-field="company_name">Company Name Pvt Ltd</h1>
          <div data-field="company_address" class="placeholder">
            Address · City · State · PIN
          </div>
          <div data-field="company_contact" class="placeholder">
            Phone · Email · Website
          </div>
        </div>
      </div>

      <div class="body" data-field="body">
        <p class="placeholder">[Date]</p>
        <p class="placeholder">[Recipient Name]</p>
        <p class="placeholder">[Recipient Address]</p>
        <p style="margin-top: 8mm">
          Dear <span data-field="recipient_name">Customer</span>,
        </p>
        <p data-field="paragraph_1" class="placeholder">
          Start writing letter content here...
        </p>
      </div>

      <div class="in-footer" data-field="footer">
        Company registration · GSTIN · Bank details
      </div>
    </div>
  </body>
</html>
