<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Letterhead — Top Right Logo</title>
    <style>
      @page {
        size: A4;
        margin: 0;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #111;
      }
      .page {
        width: 210mm;
        height: 297mm;
        padding: 18mm;
        box-sizing: border-box;
        position: relative;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 12mm;
      }
      .company-left {
        max-width: 70%;
      }
      .logo-right {
        max-width: 160px;
        text-align: right;
      }
      .company-left h1 {
        margin: 0;
        font-size: 16px;
        color: #0b5ed7;
      }
      .body {
        min-height: 200mm;
        font-size: 13px;
        line-height: 1.45;
      }
      .in-footer {
        position: absolute;
        left: 18mm;
        right: 18mm;
        bottom: 18mm;
        font-size: 11px;
        color: #666;
      }
      .placeholder {
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="page" data-template="letterhead_top_right">
      <div class="header">
        <div class="company-left">
          <h1 data-field="company_name">Company Name</h1>
          <div data-field="company_address" class="placeholder">
            Street, City, PIN
          </div>
        </div>
        <div class="logo-right" data-field="logo">
          <img src="" alt="logo" style="max-width: 100%" />
        </div>
      </div>

      <div class="body" data-field="body">
        <p class="placeholder">
          Date: <span data-field="date">2025-02-01</span>
        </p>
        <p data-field="letter_content" class="placeholder">
          Letter content goes here...
        </p>
      </div>

      <div class="in-footer" data-field="footer">Company · GSTIN · Contact</div>
    </div>
  </body>
</html>
