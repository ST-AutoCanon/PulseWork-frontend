<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Letterhead — Two Line Header</title>
    <style>
      @page {
        size: A4;
        margin: 0;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #111;
      }
      .page {
        width: 210mm;
        height: 297mm;
        padding: 18mm;
        box-sizing: border-box;
        position: relative;
      }
      .topbar {
        background: #f3f6fb;
        padding: 6px 10px;
        font-size: 11px;
        color: #333;
        text-align: right;
      }
      .header {
        display: flex;
        justify-content: flex-start;
        align-items: center;
        padding: 10px 0;
        margin-bottom: 12mm;
      }
      .logo {
        max-width: 120px;
        margin-right: 12px;
      }
      .company h1 {
        margin: 0;
        font-size: 18px;
        color: #0b5ed7;
      }
      .body {
        min-height: 200mm;
        font-size: 13px;
        line-height: 1.45;
      }
      .in-footer {
        position: absolute;
        left: 18mm;
        right: 18mm;
        bottom: 18mm;
        text-align: center;
        color: #666;
        font-size: 11px;
      }
      .placeholder {
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="page" data-template="letterhead_two_line">
      <div class="topbar" data-field="topbar">
        Phone: 000-0000 | Email: info@example.com | Website
      </div>

      <div class="header">
        <div class="logo" data-field="logo">
          <img src="" alt="logo" style="max-width: 100%" />
        </div>
        <div class="company">
          <h1 data-field="company_name">Company Name</h1>
          <div data-field="company_tag" class="placeholder">Short tagline</div>
        </div>
      </div>

      <div class="body" data-field="body">
        <p data-field="date" class="placeholder">Date</p>
        <p data-field="content" class="placeholder">Your letter text here...</p>
      </div>

      <div class="in-footer" data-field="footer">
        Registered Office · GST · Bank
      </div>
    </div>
  </body>
</html>
