<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Letterhead — Watermark</title>
    <style>
      @page {
        size: A4;
        margin: 0;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #111;
      }
      .page {
        width: 210mm;
        height: 297mm;
        padding: 20mm;
        box-sizing: border-box;
        position: relative;
        overflow: hidden;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12mm;
      }
      .logo {
        max-width: 120px;
      }
      .company h1 {
        margin: 0;
        font-size: 16px;
        color: #0b5ed7;
      }
      .watermark {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        opacity: 0.06;
        pointer-events: none;
        max-width: 60%;
      }
      .body {
        position: relative;
        z-index: 2;
        min-height: 230mm;
        font-size: 13px;
        line-height: 1.45;
      }
      .in-footer {
        position: absolute;
        left: 20mm;
        right: 20mm;
        bottom: 20mm;
        font-size: 11px;
        color: #666;
      }
      .placeholder {
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="page" data-template="letterhead_watermark">
      <div class="header">
        <div class="logo" data-field="logo">
          <img src="" alt="logo" style="max-width: 100%" />
        </div>
        <div class="company">
          <div data-field="company_name" style="font-weight: 700">
            Company Name
          </div>
          <div class="placeholder" data-field="company_contact">
            Phone · Email
          </div>
        </div>
      </div>

      <img class="watermark" data-field="watermark" src="" alt="watermark" />

      <div class="body" data-field="body">
        <p class="placeholder">
          Date: <span data-field="date">2025-04-01</span>
        </p>
        <p data-field="content" class="placeholder">
          Letter content with watermark background.
        </p>
      </div>

      <div class="in-footer" data-field="footer">
        Legal / Bank details · GST
      </div>
    </div>
  </body>
</html>
