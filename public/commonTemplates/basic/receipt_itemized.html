<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Receipt — Itemized</title>
    <style>
      @page {
        size: A4;
        margin: 0;
      }
      body {
        margin: 0;
        font-family: Tahoma, Arial, sans-serif;
        color: #111;
      }
      .page {
        width: 210mm;
        height: 297mm;
        padding: 18mm;
        box-sizing: border-box;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .logo {
        max-width: 120px;
      }
      .title {
        font-size: 18px;
        color: #0b5ed7;
        margin: 0;
      }
      .meta {
        font-size: 13px;
        margin: 8px 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
      }
      th,
      td {
        border: 1px solid #e9eef6;
        padding: 8px;
        font-size: 13px;
      }
      th {
        background: #f7f9fc;
        text-align: left;
      }
      .totals {
        margin-top: 10px;
        text-align: right;
        font-weight: 700;
      }
      .in-footer {
        margin-top: 12px;
        font-size: 12px;
        color: #666;
      }
      .placeholder {
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="page" data-template="receipt_itemized">
      <div class="header">
        <div class="logo" data-field="logo">
          <img src="" alt="logo" style="max-width: 100%" />
        </div>
        <div style="text-align: right">
          <div data-field="company_name">Company Name</div>
          <div class="placeholder" data-field="company_contact">
            Contact · Email
          </div>
        </div>
      </div>

      <div class="title">Itemized Receipt</div>

      <div class="meta">
        <span
          ><strong>Receipt #:</strong>
          <span data-field="receipt_no">R-2025-01</span></span
        >
        |
        <span
          ><strong>Date:</strong>
          <span data-field="date">2025-01-10</span></span
        >
        |
        <span
          ><strong>Customer:</strong>
          <span data-field="customer">ABC Corp</span></span
        >
      </div>

      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Item</th>
            <th>Qty</th>
            <th>Unit</th>
            <th>Price</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody data-field="line_items">
          <tr>
            <td>1</td>
            <td data-field="item_1">Service A</td>
            <td data-field="qty_1">1</td>
            <td>unit</td>
            <td data-field="price_1">₹ 2,000</td>
            <td data-field="amount_1">₹ 2,000</td>
          </tr>
        </tbody>
      </table>

      <div class="totals">
        <div>Subtotal: <span data-field="subtotal">₹ 2,000</span></div>
        <div style="font-weight: 700">
          Total Received: <span data-field="total_amount">₹ 2,000</span>
        </div>
      </div>

      <div class="in-footer">
        <div>
          <strong>Received By:</strong>
          <span data-field="received_by">Finance</span>
        </div>
        <div data-field="notes" class="placeholder">
          Receipt remarks / tax details
        </div>
      </div>
    </div>
  </body>
</html>
