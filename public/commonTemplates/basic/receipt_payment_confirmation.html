<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Receipt — Payment Confirmation</title>
    <style>
      @page {
        size: A4;
        margin: 0;
      }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: #111;
      }
      .page {
        width: 210mm;
        height: 297mm;
        padding: 20mm;
        box-sizing: border-box;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 12mm;
        margin-bottom: 12px;
      }
      .logo {
        max-width: 140px;
      }
      .title {
        font-size: 20px;
        color: #0b5ed7;
      }
      .meta {
        margin: 8px 0;
        font-size: 13px;
      }
      .box {
        border: 1px solid #e6edf8;
        padding: 12px;
        background: #fafcff;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }
      th,
      td {
        padding: 8px;
        border: 1px solid #e9eef6;
      }
      th {
        background: #f3f7ff;
      }
      .in-footer {
        margin-top: 14px;
        font-size: 12px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="page" data-template="receipt_payment_confirmation">
      <div class="header">
        <div class="logo" data-field="logo">
          <img src="" alt="logo" style="max-width: 100%" />
        </div>
        <div>
          <div class="title">Payment Confirmation</div>
          <div data-field="company_name">Company Name</div>
        </div>
      </div>

      <div class="meta">
        Payment Reference: <strong data-field="payment_ref">PMT-789</strong> |
        Date: <strong data-field="date">2025-01-05</strong>
      </div>

      <div class="box">
        <div>
          <strong>Received from:</strong>
          <span data-field="payer">Customer</span>
        </div>
        <div>
          <strong>For:</strong>
          <span data-field="purpose">Invoice INV-001</span>
        </div>
        <div>
          <strong>Amount:</strong> <span data-field="amount">₹ 5,000</span>
        </div>
        <div>
          <strong>Method:</strong>
          <span data-field="method">Bank Transfer</span>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Details</th>
            <th>Value</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Transaction ID</td>
            <td data-field="tx_id">TX123456</td>
          </tr>
          <tr>
            <td>Bank / Payment Provider</td>
            <td data-field="provider">Bank Name</td>
          </tr>
        </tbody>
      </table>

      <div style="margin-top: 12px" class="in-footer">
        This document confirms receipt of payment.
        <span data-field="notes" class="placeholder">Notes</span>
      </div>
    </div>
  </body>
</html>
