<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Receipt — POS Compact</title>
    <style>
      @page {
        size: A4;
        margin: 0;
      }
      body {
        margin: 0;
        font-family: Verdana, Arial, sans-serif;
        color: #111;
      }
      .page {
        width: 210mm;
        height: 297mm;
        padding: 18mm;
        box-sizing: border-box;
      }
      .header {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 8px;
      }
      .logo {
        max-width: 100px;
        margin-bottom: 6px;
      }
      .company {
        font-weight: 700;
      }
      .small {
        font-size: 12px;
        color: #666;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
      }
      th,
      td {
        border-bottom: 1px dashed #eee;
        padding: 6px;
        font-size: 13px;
      }
      .totals {
        margin-top: 8px;
        text-align: right;
        font-weight: 700;
      }
      .in-footer {
        margin-top: 12px;
        font-size: 12px;
        color: #666;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="page" data-template="receipt_pos_compact">
      <div class="header">
        <div class="logo" data-field="logo">
          <img src="" alt="logo" style="max-width: 100%" />
        </div>
        <div class="company" data-field="company_name">Store Name</div>
        <div class="small" data-field="company_address">
          Address · GSTIN: 00AAAAA0000A0Z0
        </div>
      </div>

      <div style="margin-top: 6px">
        <div>
          <strong>Receipt:</strong> <span data-field="receipt_no">P-100</span>
        </div>
        <div class="small">
          <strong>Date:</strong> <span data-field="date">2025-01-11</span> |
          <strong>Cashier:</strong> <span data-field="cashier">Rita</span>
        </div>
      </div>

      <table aria-label="items">
        <thead>
          <tr>
            <th>Item</th>
            <th style="text-align: right">Amount</th>
          </tr>
        </thead>
        <tbody data-field="line_items">
          <tr>
            <td data-field="item_1">Coffee</td>
            <td style="text-align: right" data-field="amount_1">₹ 120</td>
          </tr>
        </tbody>
      </table>

      <div class="totals">
        Total: <span data-field="total_amount">₹ 120</span>
      </div>

      <div class="in-footer">
        Thank you! Visit again.
        <div data-field="notes" class="small placeholder">
          Return policy applies
        </div>
      </div>
    </div>
  </body>
</html>
