<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Reimbursement — Itemized</title>
    <style>
      @page {
        size: A4;
        margin: 0;
      }
      body {
        margin: 0;
        font-family: Tahoma, Arial, sans-serif;
        color: #222;
      }
      .page {
        width: 210mm;
        height: 297mm;
        padding: 18mm;
        box-sizing: border-box;
      }
      .header {
        display: flex;
        justify-content: flex-start;
        gap: 12mm;
        align-items: center;
        margin-bottom: 8mm;
      }
      .logo {
        max-width: 100px;
      }
      .title {
        font-size: 18px;
        color: #0b5ed7;
        font-weight: 700;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
        font-size: 13px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 6px;
      }
      th {
        background: #fafbff;
      }
      .right {
        float: right;
        text-align: right;
      }
      .in-footer {
        position: absolute;
        left: 18mm;
        right: 18mm;
        bottom: 18mm;
        font-size: 11px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="page" data-template="reimbursement_itemized">
      <div class="header">
        <div class="logo" data-field="logo">
          <img src="" alt="logo" style="max-width: 100%" />
        </div>
        <div>
          <div data-field="company_name" style="font-weight: 700">
            Company Name
          </div>
          <div class="placeholder" data-field="company_address">
            Address · Phone
          </div>
          <div class="title">Reimbursement Claim Form</div>
        </div>
      </div>

      <div style="display: flex; gap: 12mm; margin-bottom: 6px">
        <div>
          <strong>Employee:</strong>
          <span data-field="employee_name">A. Kumar</span>
        </div>
        <div>
          <strong>Claim No:</strong> <span data-field="claim_no">CLM-001</span>
        </div>
        <div class="right">
          <strong>Date:</strong> <span data-field="claim_date">2025-01-10</span>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Item</th>
            <th>Category</th>
            <th>Qty</th>
            <th>Rate</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody data-field="line_items">
          <tr>
            <td>1</td>
            <td>Office Supplies</td>
            <td>Stationery</td>
            <td>1</td>
            <td>₹ 300</td>
            <td data-field="amount_1">₹ 300</td>
          </tr>
        </tbody>
      </table>

      <div style="margin-top: 10px; text-align: right">
        <div>
          <strong>Total:</strong> <span data-field="total_amount">₹ 300</span>
        </div>
      </div>

      <div style="margin-top: 12px">
        <strong>Remarks:</strong>
        <div data-field="remarks" class="placeholder">Add remarks here</div>
      </div>

      <div
        style="display: flex; justify-content: space-between; margin-top: 20mm"
      >
        <div>
          <strong>Prepared by</strong>
          <div
            style="margin-top: 18px; border-top: 1px solid #ddd; width: 180px"
          ></div>
        </div>
        <div>
          <strong>Approved by</strong>
          <div
            style="margin-top: 18px; border-top: 1px solid #ddd; width: 180px"
          ></div>
        </div>
      </div>

      <div class="in-footer">For queries contact finance@company.com</div>
    </div>
  </body>
</html>
