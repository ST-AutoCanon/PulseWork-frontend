<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Reimbursement — Per Diem</title>
    <style>
      @page {
        size: A4;
        margin: 0;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #222;
      }
      .page {
        width: 210mm;
        height: 297mm;
        padding: 18mm;
        box-sizing: border-box;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10mm;
      }
      .logo {
        max-width: 120px;
      }
      .title {
        font-size: 18px;
        color: #0b5ed7;
        font-weight: 700;
      }
      .info {
        margin-bottom: 8px;
        font-size: 13px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid #eaeef6;
        padding: 8px;
      }
      th {
        background: #f7f9fc;
      }
      .totals {
        margin-top: 8px;
        text-align: right;
        font-weight: 700;
      }
      .in-footer {
        position: absolute;
        left: 18mm;
        right: 18mm;
        bottom: 18mm;
        font-size: 11px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="page" data-template="reimbursement_perdiem">
      <div class="header">
        <div class="logo" data-field="logo">
          <img src="" alt="logo" style="max-width: 100%" />
        </div>
        <div style="text-align: right" data-field="company_name">
          Company Name
        </div>
      </div>

      <div class="title">Per Diem Claim</div>
      <div class="info">
        <span
          ><strong>Employee:</strong>
          <span data-field="employee_name">S. Patel</span></span
        >
        |
        <span
          ><strong>Trip:</strong>
          <span data-field="trip">Client Visit</span></span
        >
      </div>

      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Per Diem Rate</th>
            <th>Days</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody data-field="line_items">
          <tr>
            <td>2025-01-05</td>
            <td>₹ 1,000</td>
            <td>3</td>
            <td data-field="amount_1">₹ 3,000</td>
          </tr>
        </tbody>
      </table>

      <div class="totals">
        Total: <span data-field="total_amount">₹ 3,000</span>
      </div>

      <div style="margin-top: 12px">
        <strong>Approval:</strong>
        <div style="display: flex; gap: 20px; margin-top: 12px">
          <div>
            <div>Manager</div>
            <div
              style="margin-top: 18px; border-top: 1px solid #ddd; width: 160px"
            ></div>
          </div>
          <div>
            <div>Finance</div>
            <div
              style="margin-top: 18px; border-top: 1px solid #ddd; width: 160px"
            ></div>
          </div>
        </div>
      </div>

      <div class="in-footer">
        Per diem as per company policy. No receipts required for per diem.
      </div>
    </div>
  </body>
</html>
