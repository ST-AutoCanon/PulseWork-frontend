<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Reimbursement — Petty Cash</title>
    <style>
      @page {
        size: A4;
        margin: 0;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #111;
      }
      .page {
        width: 210mm;
        height: 297mm;
        padding: 18mm;
        box-sizing: border-box;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8mm;
      }
      .logo {
        max-width: 120px;
      }
      .title {
        font-size: 18px;
        color: #0b5ed7;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
      }
      th,
      td {
        border: 1px solid #eee;
        padding: 8px;
      }
      th {
        background: #fafcff;
      }
      .signs {
        display: flex;
        gap: 30px;
        margin-top: 16px;
      }
      .in-footer {
        position: absolute;
        left: 18mm;
        right: 18mm;
        bottom: 18mm;
        font-size: 11px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="page" data-template="reimbursement_petty_cash">
      <div class="header">
        <div class="logo" data-field="logo">
          <img src="" alt="logo" style="max-width: 100%" />
        </div>
        <div data-field="company_name">Company Name</div>
      </div>

      <div class="title">Petty Cash Reimbursement</div>

      <div style="margin-bottom: 8px">
        <strong>Date:</strong> <span data-field="date">2025-01-15</span> |
        <strong>Prepared by:</strong>
        <span data-field="employee_name">R. Singh</span>
      </div>

      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Item</th>
            <th>Qty</th>
            <th>Unit</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody data-field="line_items">
          <tr>
            <td>1</td>
            <td>Coffee for meeting</td>
            <td>2</td>
            <td>cups</td>
            <td data-field="amount_1">₹ 80</td>
          </tr>
        </tbody>
      </table>

      <div style="margin-top: 8px; text-align: right">
        <strong>Total:</strong> <span data-field="total_amount">₹ 80</span>
      </div>

      <div class="signs">
        <div>
          <div>Received by</div>
          <div
            style="margin-top: 18px; border-top: 1px solid #ddd; width: 140px"
          ></div>
        </div>
        <div>
          <div>Authorized</div>
          <div
            style="margin-top: 18px; border-top: 1px solid #ddd; width: 140px"
          ></div>
        </div>
      </div>

      <div class="in-footer">
        Small reimbursements up to company-defined petty cash limit.
      </div>
    </div>
  </body>
</html>
