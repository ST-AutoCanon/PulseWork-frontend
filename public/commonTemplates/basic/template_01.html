<div class="page" style="font-family: Arial, sans-serif">
  <div
    class="header-area"
    data-field="header"
    style="
      padding: 20px 30px;
      border-bottom: 2px solid #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
    "
  >
    <div data-field="logo">
      <img
        src="/placeholders/logo-placeholder.svg"
        alt="Company Logo"
        style="height: 60px"
      />
    </div>

    <div style="text-align: right">
      <div data-field="company_name" style="font-size: 22px; font-weight: 700">
        Company Name
      </div>
      <div data-field="company_address">Address Line 1</div>
      <div data-field="company_email">email@company.com</div>
    </div>
  </div>

  <div class="body-area" data-field="body" style="padding: 30px"></div>

  <div
    class="footer-area"
    data-field="footer"
    style="
      padding: 15px 30px;
      border-top: 1px solid #ddd;
      text-align: center;
      font-size: 12px;
    "
  >
    <div data-field="footer_note">Thank you for your business</div>
  </div>
</div>
