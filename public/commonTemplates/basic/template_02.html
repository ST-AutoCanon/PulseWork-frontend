<div class="page" style="font-family: Helvetica, sans-serif">
  <div
    class="header-area"
    data-field="header"
    style="padding: 30px; text-align: center; border-bottom: 1px solid #ccc"
  >
    <div data-field="logo">
      <img
        src="/placeholders/logo-placeholder.svg"
        alt="Company Logo"
        style="height: 70px"
      />
    </div>

    <div
      data-field="company_name"
      style="font-size: 20px; font-weight: 600; margin-top: 10px"
    >
      Company Name
    </div>
  </div>

  <div class="body-area" data-field="body" style="padding: 30px"></div>

  <div
    class="footer-area"
    data-field="footer"
    style="padding: 20px; text-align: center; font-size: 11px; color: #555"
  >
    <div data-field="company_address">Full Company Address</div>
  </div>
</div>
