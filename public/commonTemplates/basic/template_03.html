<div class="page" style="font-family: &quot;Segoe UI&quot;, sans-serif">
  <div
    class="header-area"
    data-field="header"
    style="display: flex; padding: 20px; border-bottom: 1px solid #eee"
  >
    <div style="width: 8px; background: #0f6679; margin-right: 15px"></div>

    <div
      style="
        flex: 1;
        display: flex;
        justify-content: space-between;
        align-items: center;
      "
    >
      <div data-field="logo">
        <img
          src="/placeholders/logo-placeholder.svg"
          alt="Company Logo"
          style="height: 55px"
        />
      </div>

      <div style="text-align: right; margin-right: 4%">
        <div
          data-field="company_name"
          style="font-weight: 700; font-size: 18px"
        >
          Company Name
        </div>
        <div data-field="company_phone">+91 XXXXX XXXXX</div>
      </div>
    </div>
  </div>

  <div class="body-area" data-field="body" style="padding: 30px"></div>

  <div
    class="footer-area"
    data-field="footer"
    style="padding: 15px 20px; background: #f7f7f7; font-size: 12px"
  >
    <div data-field="footer_note">Authorized Signature</div>
  </div>
</div>
