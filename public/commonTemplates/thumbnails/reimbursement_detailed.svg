<svg xmlns="http://www.w3.org/2000/svg" width="420" height="540" viewBox="0 0 420 540">
  <rect width="100%" height="100%" fill="#ffffff" stroke="#e6e9ef" stroke-width="1"/>
  <!-- header area -->
  <rect x="10" y="10" width="400" height="80" fill="#fafbff" />
  <!-- logo box -->
  <rect x="20" y="20" width="90" height="40" rx="6" fill="#0b5ed7" opacity="0.95"/>
  <text x="65.0" y="44.0" font-size="12" font-family="Arial" fill="#fff" text-anchor="middle">LOGO</text>
  <!-- company block top-right -->
  <g transform="translate(250,24)">
    <text x="0" y="0" font-family="Arial" font-size="14" fill="#111">Company Name</text>
    <text x="0" y="16" font-family="Arial" font-size="11" fill="#666">Address · Contact</text>
  </g>
  <!-- watermark hint if any -->
  
  <!-- content lines -->
  <g transform="translate(30,110)" fill="#444" font-family="Arial">
    <rect x="0" y="0" width="360" height="8" fill="#f0f2f7" rx="3" />
    <rect x="0" y="18" width="300" height="8" fill="#f0f2f7" rx="3" />
    <rect x="0" y="36" width="240" height="8" fill="#f0f2f7" rx="3" />
    <rect x="0" y="54" width="220" height="8" fill="#f0f2f7" rx="3" />
    <rect x="0" y="90" width="360" height="140" fill="#fff" stroke="#eee" />
  </g>
  <!-- footer -->
  <rect x="10" y="470" width="400" height="48" fill="#f8f9fb" />
  <text x="210" y="500" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">Footer / Bank / Legal</text>
  <!-- label -->
  <text x="20" y="528" font-family="Arial" font-size="10" fill="#999">reimbursement_detailed</text>
</svg>